<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Update</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .plans-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .plan-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            width: 300px;
            text-align: center;
        }

        .plan-price {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .subscribe-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="plans-container">
        {% for plan in plans %}
        <div class="plan-card">
            <h2>{{ plan.name }}</h2>
            <div class="plan-price">
                {% if plan.price == 0 %}
                    Free
                {% else %}
                    R{{ plan.price }}/month
                {% endif %}
            </div>
            <div class="plan-features">
                {{ plan.description }}
            </div>
            <button class="subscribe-button" onclick="initializePayment({{ plan.id }})">
                {% if plan.price == 0 %}Start Free{% else %}Subscribe Now{% endif %}
            </button>
        </div>
        {% endfor %}
    </div>

    <script>
        function initializePayment(planId) {
            fetch(`/subscribe/${planId}/`)
                .then(response => response.json())
                .then(data => {
                    if (data.data && data.data.authorization_url) {
                        window.location.href = data.data.authorization_url;
                    } else {
                        alert('Payment initialization failed');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Payment initialization failed');
                });
        }
    </script>
</body>
</html>
