{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Point of Sale</title>
        <script src="https://unpkg.com/html5-qrcode"></script>
        <link rel="stylesheet" href="{% static 'css/main.css' %}" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        />
        <style>
            body {
                font-family: "Poppins", sans-serif;
                margin: 20px;
                background-color: #fffff;
            }
            .container {
                display: flex;
                gap: 20px;
                max-width: 1200px;
                margin: 0 auto;
                border: 2px solid #ddd;
                border-radius: 8px;
            }
            .scanner-section {
                flex: 1;
                background: white;
                padding: 20px;
                border-radius: 8px;
                min-width: 300px;
            }
            .cart-section {
                flex: 2;
                background: white;
                padding: 20px;
                border-radius: 8px;
            }
            h4 {
                font-size: 20px;
            }
            #reader {
                width: 100%;
                min-height: 300px;
            }
            .table-container {
                margin-top: 20px;
                overflow-x: auto;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }
            th,
            td {
                padding: 12px;
                text-align: left;
                border-bottom: 1px solid #ddd;
            }
            th {
                background-color: #fffff;
            }
            .total-section {
                margin-top: 20px;
                padding: 12px;
                border: 1px solid #ddd;
                border-radius: 8px;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .total-section h3 {
                margin: 0;
                font-size: 18px;
            }
            .total-amount {
                font-size: 20px;
                font-weight: bold;
                color: #28a745;
            }
            .action-buttons {
                margin-top: 20px;
                display: flex;
                gap: 10px;
            }
            button {
                padding: 10px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
            }
            .checkout-btn {
                background-color: white;
                color: #28a745;
                border: 2px solid #28a745;
            }
            .checkout-btn:hover {
                background-color: #28a745;
                color: white;
                border: 2px solid #28a745;
            }
            .clear-btn {
                background-color: #dc3545;
                color: white;
                margin-left: 450px;
            }
            .remove-item {
                color: #dc3545;
                cursor: pointer;
            }
            #scanner-status {
                margin-top: 10px;
                padding: 10px;
                border-radius: 4px;
                text-align: center;
            }
            .success {
                background-color: #d4edda;
                color: #155724;
            }
            .error {
                background-color: #f8d7da;
                color: #721c24;
            }
            .modals {
                display: none;
                position: fixed;
                z-index: 1;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                overflow: auto;
                background-color: rgb(0, 0, 0);
                background-color: rgba(0, 0, 0, 0.4);
            }
            .modals-content {
                background-color: #fefefe;
                margin: 15% auto;
                padding: 20px;
                border: 1px solid #888;
                width: 50%;
            }
            .close {
                color: #aaa;
                float: right;
                font-size: 28px;
                font-weight: bold;
            }
            .close:hover,
            .close:focus {
                color: black;
                text-decoration: none;
                cursor: pointer;
            }
            .calculator {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                grid-gap: 10px;
                padding: 20px;
            }
            .calculator button {
                font-size: 20px;
                padding: 20px;
                border: none;
                background-color: #f0f0f0;
                cursor: pointer;
            }
            .calculator button:hover {
                background-color: #ccc;
            }
            #result {
                grid-column: span 4;
                font-size: 30px;
                text-align: right;
                padding: 20px;
                background-color: #f5f5f5;
                border: 1px solid #ddd;
            }
            @media screen and (max-width: 768px) {
                .container {
                    flex-direction: column;
                    padding: 10px;
                }
                .scanner-section,
                .cart-section {
                    width: 100%;
                    min-width: unset;
                    margin-left: -27px;
                }
                #reader {
                    width: 100% !important;
                }
                .table-container {
                    margin: 0 -10px;
                    padding: 0 10px;
                }
                #pos-table {
                    font-size: 14px;
                }
                .action-buttons {
                    flex-direction: column;
                }
                .checkout-btn,
                .clear-btn {
                    width: 100%;
                    margin: 5px 0;
                }
                .modals-content {
                    margin: 10% auto;
                    width: 90%;
                    max-width: none;
                    padding: 15px;
                }
                .calculator {
                    gap: 5px;
                }
                .calculator button {
                    padding: 15px 0;
                    font-size: 16px;
                }
            }
            @media screen and (max-width: 480px) {
                #pos-table th,
                #pos-table td {
                    padding: 8px 5px;
                    font-size: 13px;
                }
                .total-section {
                    text-align: center;
                }
                .total-amount {
                    font-size: 24px;
                    margin: 10px 0;
                }
                .form-group input {
                    font-size: 16px;
                }
                .modals-content {
                    margin: 10% auto;
                    width: 90%;
                    max-width: none;
                    padding: 15px;
                }
                .calculator {
                    gap: 5px;
                }
                .calculator button {
                    padding: 15px 0;
                    font-size: 16px;
                }
            }


            .loader-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(255, 255, 255, 0.9);
                z-index: 9999;
                justify-content: center;
                align-items: center;
                flex-direction: column;
            }
            .loader-content {
                text-align: center;
                background: white;
                padding: 2rem;
                border-radius: 12px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }
            .spinner {
                width: 50px;
                height: 50px;
                border: 5px solid #f3f3f3;
                border-top: 5px solid #3498db;
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin: 0 auto 1rem auto;
            }
            .processing-text {
                color: #2c3e50;
                font-size: 1.2rem;
                margin-top: 1rem;
            }
            .checkmark {
                display: none;
                width: 50px;
                height: 50px;
                margin: 0 auto 1rem auto;
            }
            .checkmark.show {
                display: block;
                animation: scale-in 0.3s ease-out;
            }
            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            @keyframes scale-in {
                0% {
                    transform: scale(0);
                }
                100% {
                    transform: scale(1);
                }
            }
        </style>
    </head>
    <body>
        <nav class="navbar">
            <a href="{% url 'index' %}" class="logo">KASI LEDGER</a>
            <div class="quote_btn-container">
                <a href="#" id="openCalculatorBtn" class="sign-up"><span>Calculator</span></a>
            </div>
        </nav>
        <div id="calculatorModal" class="modals">
            <div class="modals-content">
                <span class="close">&times;</span>
                <div class="calculator">
                    <div id="result">0</div>
                    <button onclick="appendNumber(1)">1</button>
                    <button onclick="appendNumber(2)">2</button>
                    <button onclick="appendNumber(3)">3</button>
                    <button onclick="appendOperator('+')">+</button>
                    <button onclick="appendNumber(4)">4</button>
                    <button onclick="appendNumber(5)">5</button>
                    <button onclick="appendNumber(6)">6</button>
                    <button onclick="appendOperator('-')">-</button>
                    <button onclick="appendNumber(7)">7</button>
                    <button onclick="appendNumber(8)">8</button>
                    <button onclick="appendNumber(9)">9</button>
                    <button onclick="appendOperator('*')">*</button>
                    <button onclick="appendNumber(0)">0</button>
                    <button onclick="clearResult()">C</button>
                    <button onclick="calculateResult()">=</button>
                    <button onclick="appendOperator('/')">/</button>
                </div>
            </div>
        </div>
        <div class="loader-overlay">
            <div class="loader-content">
                <div class="spinner"></div>
                <div class="checkmark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2">
                        <path d="M20 6L9 17L4 12" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <div class="processing-text">Processing Sale...</div>
            </div>
        </div>
        <div class="container">
            <div class="scanner-section">
                <h4>Scanner</h4>
                <div id="reader"></div>
                <div id="scanner-status"></div>
                <audio id="beepAudio">
                    <source src="{% static 'js/BEEP.wav' %}" type="audio/mpeg" />
                </audio>
            </div>
            <div class="cart-section">
                <h4>Current Sale</h4>
                <div class="table-container">
                    <table id="pos-table">
                        <thead>
                            <tr>
                                <th>Product Name</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="total-section">
                    <h3>Total Amount</h3>
                    <div class="total-amount">R0.00</div>
                </div>
                <div class="form-group" style="margin: 15px 0">
                    <label for="customerEmail">Customer Email (Optional):</label>
                    <input
                        type="email"
                        id="customerEmail"
                        class="form-control"
                        placeholder="Enter customer email for receipt"
                        style="width: 95%; padding: 8px; margin: 5px 0"
                    />
                </div>
                <div class="action-buttons">
                    <button class="checkout-btn" onclick="processSale()">Complete Sale</button>
                    <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
                </div>
            </div>
        </div>
        <script>
            const CHECK_PRODUCT_URL = "{% url 'check_product' %}";
            const PROCESS_SALE_URL = "{% url 'process_sale' %}";
            const CSRF_TOKEN = "{{ csrf_token }}";
        </script>
        <script src="{% static 'js/pos.js' %}"></script>
        <script src="{% static 'js/jquery-3.4.1.min.js.js' %}"></script>
    </body>
</html>
