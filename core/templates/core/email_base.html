<html>
  <head>
    <meta charset="UTF-8" />
    <title>{{ subject }}</title>

  <body style="font-family: Arial, sans-serif; background-color:#f7f7f7; margin:0; padding:0;">
    <div style="max-width:600px; margin:20px auto; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 2px 5px rgba(0,0,0,0.1);">

      <!-- HEADER -->
      <div style="background-color:#000; color:#fff; text-align:center; padding:20px;">
        <img src="https://kasialgorithms.co.za/static/logo.png" alt="Kasi Algorithms" width="100" style="display:block; margin:0 auto;" />
        <h2 style="margin:10px 0 0;">Kasi Algorithms</h2>
      </div>

      <!-- BODY -->
      <div style="padding:20px; color:#333;">
        {{ body|safe }}
      </div>

      <!-- FOOTER -->
      <div style="background:#f2f2f2; padding:15px; text-align:center; font-size:13px; color:#555;">
        <p>Thank you for using <strong>Kasi Algorithms</strong>.</p>
        <p>Visit our website: <a href="https://kasialgorithms.co.za" style="color:#000;">kasialgorithms.co.za</a></p>
        <p>© 2025 Kasi Algorithms. All rights reserved.</p>
      </div>

    </div>
  </body>
</html>
