<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; margin: 0; padding: 20px; background: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        .header { text-align: center; background: #4a6cf7; color: white; padding: 20px; border-radius: 10px 10px 0 0; }
        .content { padding: 20px; }
        .cta-button { background: #4a6cf7; color: white; padding: 15px 30px; text-decoration: none; border-radius: 5px; display: inline-block; margin: 20px 0; }
        .footer { text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Special Offer!</h1>
        </div>
        
        <div class="content">
            <p>Hello valued customer,</p>
            
            <p>We're excited to offer you something special as a thank you for your loyalty.</p>
            
            <div style="text-align: center;">
                <a href="#" class="cta-button">Claim Your Offer</a>
            </div>
            
            <p>This is a limited time opportunity, so don't miss out!</p>
            
            <p>Best regards,<br>Your Business Team</p>
        </div>
        
        <div class="footer">
            <p>&copy; 2024 Your Business. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
